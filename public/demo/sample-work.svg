<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <rect width="800" height="1000" fill="#FFFFFF" />
  <!-- 연습장 줄무늬 -->
  <line x1="60" y1="120" x2="740" y2="120" stroke="#E2E8F0" stroke-width="1.5" />
  <line x1="60" y1="220" x2="740" y2="220" stroke="#E2E8F0" stroke-width="1.5" />
  <line x1="60" y1="320" x2="740" y2="320" stroke="#E2E8F0" stroke-width="1.5" />
  <line x1="60" y1="420" x2="740" y2="420" stroke="#E2E8F0" stroke-width="1.5" />
  <line x1="60" y1="520" x2="740" y2="520" stroke="#E2E8F0" stroke-width="1.5" />
  <!-- 학생 손글씨 모의 수식 -->
  <text x="80" y="100" font-family="'Comic Sans MS', cursive, sans-serif" font-size="32" fill="#1E3A8A">2x + 4 = 12</text>
  <text x="80" y="200" font-family="'Comic Sans MS', cursive, sans-serif" font-size="32" fill="#1E3A8A">2x = 12 + 4</text>
  <text x="80" y="300" font-family="'Comic Sans MS', cursive, sans-serif" font-size="32" fill="#1E3A8A">2x = 16</text>
  <text x="80" y="400" font-family="'Comic Sans MS', cursive, sans-serif" font-size="32" fill="#1E3A8A">x = 8</text>
  <!-- 이름 영역 (마스킹 테스트용) -->
  <rect x="580" y="40" width="160" height="50" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
  <text x="600" y="72" font-family="sans-serif" font-size="18" fill="#64748B">이름: 홍길동</text>
</svg>
