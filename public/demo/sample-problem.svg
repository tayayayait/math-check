<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#FFFFFF" />
  <rect x="20" y="20" width="760" height="560" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
  <!-- 문제 헤더 -->
  <text x="50" y="80" font-family="sans-serif" font-size="28" font-weight="bold" fill="#0F172A">[문제 12]</text>
  <text x="50" y="130" font-family="sans-serif" font-size="22" fill="#334155">다음 일차방정식을 풀고 x의 값을 구하시오.</text>
  <!-- 수식 -->
  <rect x="50" y="170" width="400" height="90" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <text x="80" y="228" font-family="serif" font-size="34" font-style="italic" fill="#1E293B">2x + 4 = 12</text>
  <!-- 가이드 라인 -->
  <line x1="50" y1="320" x2="750" y2="320" stroke="#E2E8F0" stroke-dasharray="6,6" stroke-width="2" />
  <text x="50" y="360" font-family="sans-serif" font-size="16" fill="#94A3B8">* 풀이 과정과 답을 명확하게 작성해 주세요.</text>
</svg>
